[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares"
version = "0.1.0"
description = "Deterministic foundations for autonomous indoor mapping research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ares = "ares.cli:main"

[tool.setuptools.packages.find]
include = ["ares", "ares.*"]

[tool.setuptools.package-data]
ares = ["data/*.json", "data/**/*.json"]
