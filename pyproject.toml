[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares"
version = "0.6.0"
description = "Indoor mapping simulation, exploration and differentiable flight learning research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
simulation = ["numpy>=2,<3", "scipy>=1.14,<2"]
cuda = ["numpy>=2,<3", "scipy>=1.14,<2", "cupy-cuda13x[ctk]>=14,<15"]
flight = ["numpy>=2,<3", "scipy>=1.14,<2", "torch>=2.11,<2.12"]
recording = ["numpy>=2,<3", "pyrealsense2>=2.59.1"]

[project.scripts]
ares = "ares.cli:main"

[tool.setuptools.packages.find]
include = ["ares", "ares.*"]

[tool.setuptools.package-data]
ares = ["data/*.json", "data/**/*.json", "data/**/*.html", "vendor/**/*.txt", "vendor/**/LICENSE", "vendor/**/UPSTREAM.md"]
"ares.verified_safety" = ["*.zip", "*.json"]
